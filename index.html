<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boobalan E - Portfolio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #06b6d4;
            --accent-color: #3b82f6;
            --bg-dark: #030712;
        }

        body {
            background: var(--bg-dark);
            color: white;
            overflow-x: hidden;
        }

        .space-bg {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite;
        }

        .constellation {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
        }

        .constellation::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(var(--rotate));
        }

        .nebula {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .cosmic-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cosmic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transition: 0.5s;
        }

        .cosmic-card:hover::before {
            left: 100%;
        }

        .cosmic-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.3);
            border-color: rgba(79, 70, 229, 0.3);
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rotate var(--duration) linear infinite;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            transform-origin: 50% 50%;
            animation: orbit var(--duration) linear infinite;
        }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
            to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cursor-glow {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, 
                rgba(79, 70, 229, 0.15) 0%, 
                rgba(6, 182, 212, 0.1) 50%, 
                transparent 70%);
            position: fixed;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: all 0.1s ease;
            mix-blend-mode: screen;
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transform-origin: 0;
            transform: scaleX(0);
            z-index: 1000;
        }

        .nav-item {
            position: relative;
            overflow: hidden;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .nav-item:hover::after {
            transform: translateX(0);
        }

        .skill-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .skill-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            animation: fillProgress 1.5s ease-out forwards;
            transform-origin: left;
        }

        @keyframes fillProgress {
            from { transform: scaleX(0); }
            to { transform: scaleX(var(--progress)); }
        }
    </style>
</head>
<body class="space-bg">
    <div class="nebula"></div>
    <div class="cursor-glow"></div>
    <div class="scroll-progress"></div>

    <script>
        // Create stars
        function createStars() {
            const container = document.body;
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.setProperty('--duration', (Math.random() * 3 + 1) + 's');
                container.appendChild(star);
            }
        }

        // Create constellations
        function createConstellations() {
            const container = document.body;
            for (let i = 0; i < 5; i++) {
                const constellation = document.createElement('div');
                constellation.className = 'constellation';
                constellation.style.left = Math.random() * 100 + 'vw';
                constellation.style.top = Math.random() * 100 + 'vh';
                constellation.style.setProperty('--rotate', Math.random() * 360 + 'deg');
                container.appendChild(constellation);
            }
        }

        // Cursor glow effect
        function handleMouseMove(e) {
            const cursor = document.querySelector('.cursor-glow');
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        }

        // Scroll progress
        function updateScrollProgress() {
            const progress = document.querySelector('.scroll-progress');
            const scrollPercent = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
            progress.style.transform = `scaleX(${scrollPercent})`;
        }

        // Parallax effect for cosmic cards
        function handleParallax(e) {
            const cards = document.querySelectorAll('.cosmic-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const deltaX = (e.clientX - centerX) / 20;
                const deltaY = (e.clientY - centerY) / 20;
                card.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            });
        }

        // Initialize
        window.onload = () => {
            createStars();
            createConstellations();
            
            // Event listeners
            document.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('scroll', updateScrollProgress);
            document.addEventListener('mousemove', handleParallax);

            // Initialize skill progress bars
            const skillBars = document.querySelectorAll('.skill-progress-bar');
            skillBars.forEach(bar => {
                const progress = parseFloat(bar.getAttribute('data-progress')) / 100;
                bar.style.setProperty('--progress', progress);
            });
        };
    </script>

    <!-- Rest of the HTML content remains the same as before, but with added class names for new effects -->
    <!-- Navigation -->
    <nav class="bg-transparent backdrop-blur-md border-b border-white/10 p-4 sticky top-0 z-50">
        <!-- Same content as before -->
    </nav>

    <!-- Sections remain the same but with added cosmic-card classes and skill progress bars -->
    <!-- ... -->

</body>
</html>
